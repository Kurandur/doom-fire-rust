<!DOCTYPE html>
<html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<head>
    <title>Doom fire in rust</title>

    
<script type="module">
import init, * as bindings from 'https://kurandur.github.io/doom-fire-rust/doom-fire-rust-c3cd1dee4d9f1e6.js';
const wasm = await init({ module_or_path: 'https://kurandur.github.io/doom-fire-rust/doom-fire-rust-c3cd1dee4d9f1e6_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <base href="https://kurandur.github.io/doom-fire-rust/" />
    <link rel="icon" href="https://kurandur.github.io/doom-fire-rust/favicon-6bfd404756441e5c.ico" integrity="sha384-XOyrkg+XoR7UDcowe5lB6xeBcT2gWqM4y3xcDgIGdfq11NCH26PkpRyeZIl5yMyR"/>
    

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="white">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#404040">

    <style>
        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        body {
            /* Light mode background color for what is not covered by the egui canvas,
            or where the egui canvas is translucent. */
            background: #909090;
        }

        @media (prefers-color-scheme: dark) {
            body {
                /* Dark mode background color for what is not covered by the egui canvas,
                or where the egui canvas is translucent. */
                background: #404040;
            }
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        /* Make canvas fill entire document: */
        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-size: 24px;
            font-family: Ubuntu-Light, Helvetica, sans-serif;
            text-align: center;
        }

        /* ---------------------------------------------- */
        /* Loading animation from https://loading.io/css/ */
        .lds-dual-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 24px;
            height: 24px;
            margin: 0px;
            border-radius: 50%;
            border: 3px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
<link rel="modulepreload" href="https://kurandur.github.io/doom-fire-rust/doom-fire-rust-c3cd1dee4d9f1e6.js" crossorigin="anonymous" integrity="sha384-Ry6gNSdElhzTSVco6+B3cWc6JBYZgQkKzDVu+IxKT5M8G1CFT876A1ADVtEviuRN"><link rel="preload" href="https://kurandur.github.io/doom-fire-rust/doom-fire-rust-c3cd1dee4d9f1e6_bg.wasm" crossorigin="anonymous" integrity="sha384-TxCB9VAJ5YpjJ39VNLreKbFRaNtRCgmhHqP3NfPz+KYUao912xyD+5w8/uygLaXe" as="fetch" type="application/wasm"></head>

<body>
    <canvas id="the_canvas_id"></canvas>
    <div class="centered" id="loading_text">
        <noscript>You need javascript to use this website</noscript>
        <p style="font-size:16px">
            Loading…
        </p>
        <div class="lds-dual-ring"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator && window.location.hash !== "#dev") {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
