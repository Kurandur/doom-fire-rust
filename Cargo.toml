[package]
name = "doom-fire-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.33.0", features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.33.0"
getrandom = { version = "0.3.4", features = ["wasm_js"] }
log = "0.4.28"
serde = { version = "1.0.228", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.55"
web-sys = "0.3.82"

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2









